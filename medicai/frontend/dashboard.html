<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Dashboard - MedicAi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f9f9; 
      color: #333;
    }

    header {
      background-color: #008b8b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      gap: 30px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #008b8b;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    .green-btn {
      background-color: #27ae60;
    }

    .green-btn:hover {
      background-color: #219150;
    }

    .user-info {
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
      font-size: 1rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #008b8b;
      color: white;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>👤 User Dashboard</h1>
    <p>Your personal health assistant portal</p>
  </header>

  <div class="container">

    <!-- 🧾 User Info -->
    <div class="card">
      <h2>User Profile</h2>
      <div class="user-info"><strong>Role:</strong> <span id="userRole">Loading...</span></div>
      <div class="user-info"><strong>ID:</strong> <span id="userId">Loading...</span></div>
    </div>

    <!-- 📅 Book Appointment -->
    <div class="card">
      <h2>Book an Appointment</h2>
      <form id="bookingForm">
        <label for="patient_id">Patient ID</label>
        <input type="number" id="patient_id" placeholder="Enter Patient ID" required />

        <label for="doctor_id">Doctor ID</label>
        <input type="number" id="doctor_id" placeholder="Enter Doctor ID" required />

        <label for="date">Preferred Date</label>
        <input type="date" id="date" required />

        <label for="time">Preferred Time</label>
        <input type="time" id="time" required />

        <label for="reason">Reason for Visit</label>
        <textarea id="reason" rows="3" placeholder="Briefly describe your issue..."></textarea>

        <button type="submit">Book Appointment</button>
      </form>
    </div>

    <!-- 🔍 Symptom Checker -->
    <div class="card">
      <h2>Symptom Checker</h2>
      <label for="symptomsInput">Enter Symptoms (comma-separated)</label>
      <input type="text" id="symptomsInput" placeholder="e.g., fever, cough, fatigue" />

      <button onclick="checkSymptoms()">Check Symptoms</button>
      <p id="diseaseResult" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- 💬 Chatbot Link -->
    <div class="card">
      <h2>Need Help?</h2>
      <a href="../frontend/chatbot.html">
        <button class="green-btn" style="width: 100%; padding: 12px;">💬 Chat with AI Assistant</button>
      </a>
    </div>

  </div>

  <footer>
    &copy; 2025 MedicAi. All rights reserved.
  </footer>

  <script src="../frontend/script.js"></script>
</body>
</html>
